[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voter-search-pipeline"
version = "0.1.0"
description = "State-pluggable connectors, fuzzy matching, and a search CLI for India's digitized 2002-era electoral rolls."
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy==2.0.2",
    "rapidfuzz==3.13.0",
    "indic-transliteration==2.3.82",
    "pdfplumber==0.11.8",
    "playwright==1.60.0",
    "requests==2.32.5",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
eval = [
    "scikit-learn==1.6.1",
    "sentence-transformers==5.1.2",
    "torch==2.8.0",
]

[tool.setuptools]
py-modules = [
    "matching",
    "build_db",
    "build_roll_years",
    "cross_reference",
    "transliteration",
    "migrate_translit",
    "search",
    "audit_raw_csv",
    "check_servable",
    "ocr_vision",
    "decoder_oracle",
    "wb_decode_census",
    "eval_embeddings",
    "download_2002_all",
    "download_haryana",
    "download_west_bengal",
    "download_2025_pilot",
]
packages = ["states"]

[tool.setuptools.package-dir]
"" = "scripts"
states = "states"

[tool.setuptools.package-data]
states = ["meta/*.json", "meta/sir_source_urls/*.json", "meta/sir_source_urls/*.xlsx"]
